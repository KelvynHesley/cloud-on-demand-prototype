# Nome do workflow que aparecerá na aba "Actions" do GitHub
name: CI - Build e Teste da Imagem Docker

# Define o gatilho (trigger) para a automação
on:
  # Roda este workflow sempre que houver um 'push' na branch 'main'
  push:
    branches: [ "main" ]
  # Roda também em pull requests para a branch 'main'
  pull_request:
    branches: [ "main" ]

# Define os trabalhos (jobs) a serem executados
jobs:
  # Nome do nosso único job
  build:
    # O GitHub irá provisionar uma máquina virtual Ubuntu sob demanda para rodar nosso job
    runs-on: ubuntu-latest

    # Define os passos (steps) que o job irá executar em sequência
    steps:
    # 1. Baixa o código do seu repositório para a máquina virtual
    - name: Checkout do código
      uses: actions/checkout@v3

    # 2. Executa o comando 'docker build' para construir a imagem
    - name: Build da imagem Docker
      run: docker build . --file Dockerfile --tag meu-app-teste:latest